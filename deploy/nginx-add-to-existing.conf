# ============================================================
# Mavjud nginx server blokiga QO'SHISH kerak bo'lgan qism.
# Butun serveringizning HTTPS server { ... } bloki ichiga
# quyidagi location blokni qo'shing.
#
# Fayl: /etc/nginx/sites-available/YOUR_EXISTING_SITE
# ============================================================

    # Comfort Bot — MoySklad webhooks
    location /moysklad/ {
        proxy_pass         http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

# ============================================================
# Agar serveringizda Caddy ishlatilsa:
#   mavjud Caddyfile ga qo'shing:
#
#   yourdomain.com {
#       ...mavjud bloklar...
#       reverse_proxy /moysklad/* 127.0.0.1:8082
#   }
# ============================================================
