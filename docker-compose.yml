services:
  bot:
    build:
      context: "./OY - Comfort bot"
    restart: unless-stopped
    env_file: .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # Bot ichkarida WEBHOOK_PORT portida tinglaydi.
    # Xost portini WEBHOOK_HOST_PORT o'zgaruvchisi bilan belgilang.
    ports:
      - target: ${WEBHOOK_PORT:-8080}
        published: "${WEBHOOK_HOST_PORT:-}"
        protocol: tcp
    volumes:
      - bot_data:/data          # nom o'zgartirilmadi — mavjud DB saqlanadi
      - ./assets:/app/assets
    networks:
      - comfort_bot_net

volumes:
  bot_data:

networks:
  comfort_bot_net:
