services:
  bot:
    build:
      context: "./OY - Comfort bot"
    restart: unless-stopped
    env_file: .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # Faqat localhost ga ochiladi — mavjud nginx/caddy orqali proxy qilinadi.
    # WEBHOOK_HOST_PORT ni .env da o'zgartiring (default: 8082).
    # Boshqa loyihada 8082 band bo'lsa boshqa port tanlang (masalan 8083).
    ports:
      - "127.0.0.1:${WEBHOOK_HOST_PORT:-8082}:8080"
    volumes:
      - comfort_bot_data:/data
      - ./assets:/app/assets
    networks:
      - comfort_bot_net

volumes:
  comfort_bot_data:

networks:
  comfort_bot_net:
